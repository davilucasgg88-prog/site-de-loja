# Publica a loja no GitHub Pages a cada push na branch principal.
# Antes, ative em Settings → Pages → Source: "GitHub Actions".
name: Publicar loja

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Separar os arquivos do site
        run: |
          mkdir -p _site
          cp -r index.html 404.html manifest.webmanifest sw.js robots.txt css js img fonts _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
